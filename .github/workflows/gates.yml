name: gates

# 这个 workflow 就是宪法的执行机构。
# 分支保护里要求的必过检查名叫 "gates"，即本文件的 summary job。
#
# 设计原则：与代码无关的闸门（G3/G4/G5）必须在 M0 第一天就能跑，
# 因为它们要保护的正是"还没有代码"的这个阶段。与代码有关的闸门
# 随 M1 逐步接上，接上之前保持显式 skip，不许静默跳过。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gates-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ── G0 制度镜像完整性 ─────────────────────────────────────────
  # 必须跑。如果制度镜像被动过手脚，后面所有闸门都不可信——
  # 一个能改自己判决依据的被告，判什么都没有意义。
  studio:
    name: 制度镜像 (G0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # --remote 会回源核对 tag，能抓住"改了镜像又重新生成清单"这种作弊
      - name: 镜像与钉住的框架版本逐字节一致
        run: node tools/studio-sync.mjs --remote

  # ── G3 信封 + G4 小步 + G5 车道 ──────────────────────────────
  # 不依赖任何项目代码，M0 第一天即生效
  discipline:
    name: 纪律闸门 (G3/G4/G5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 提取 Bot 代号
        id: bot
        run: |
          BRANCH="${{ github.head_ref }}"
          CODE=$(echo "$BRANCH" | sed -n 's|^lane/\([A-Z][0-9]\)/.*|\1|p')
          if [ -z "$CODE" ]; then
            echo "::error::分支名 '$BRANCH' 不符合 lane/<CODE>/T-XXX"
            exit 1
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # 闸门本身也需要被测试。一条从未被触发过的规则，
      # 你无法确定它到底在不在工作。
      - name: 车道闸门自测（引擎，工作室层）
        run: node docs/_studio/tools/gates/lane-check.test.mjs

      - name: 车道归属断言（本项目的表）
        run: node tools/gates/ownership.test.mjs

      - name: G5 · 车道
        run: node docs/_studio/tools/gates/lane-check.mjs "${{ steps.bot.outputs.code }}" origin/main
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: G3+G4 · 信封与证据
        run: node docs/_studio/tools/gates/envelope-check.mjs "${{ github.head_ref }}" origin/main

  # ── G2 规格完整性 ─────────────────────────────────────────────
  docs:
    name: 文档闸门 (G2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 愿景与制度镜像未被改动
        run: |
          # 由 lane-check 拦截过一次，这里做第二道，防止 lane-check 本身被改坏
          if git diff --name-only origin/main...HEAD | grep -E '^docs/00-charter/vision\.md$'; then
            echo "::error::愿景由人类保留。需要变更请提 ADR。"
            exit 1
          fi
          if git diff --name-only origin/main...HEAD | grep -E '^docs/_studio/'; then
            echo "::error::docs/_studio/ 是工作室框架的只读镜像。"
            echo "想改制度：去 sunset-studio 提 PR → 发新版本 → 在本仓库升级 .studio-version。"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 死链、失效的 /sop-xxx 引用、禁用术语
      - name: 文档自检
        run: node docs/_studio/tools/gates/selfcheck.mjs

  # ── G6 机器验收 ───────────────────────────────────────────────
  # M0 期间没有代码可测。这里刻意 skip 而不是假装通过——
  # 静默跳过的检查比没有检查更危险，因为它会给人虚假的安全感。
  build:
    name: 机器验收 (G6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测代码是否已存在
        id: check
        run: |
          if [ -f pnpm-workspace.yaml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::尚无代码骨架（M0 进行中），G6 暂不适用。"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.ready == 'true'
        with: { version: 9 }

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: pnpm

      - if: steps.check.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        if: steps.check.outputs.ready == 'true'
        run: pnpm typecheck

      - name: Lint
        if: steps.check.outputs.ready == 'true'
        run: pnpm lint

      - name: 单元测试
        if: steps.check.outputs.ready == 'true'
        run: pnpm test

      - name: 依赖方向 (architecture.md §2.1)
        if: steps.check.outputs.ready == 'true'
        run: pnpm gates:deps

      - name: 确定性回放
        if: steps.check.outputs.ready == 'true'
        run: pnpm test:replay

      # ── G7 手感闸门，M1 起接入 ──
      - name: 帧数据快照
        if: steps.check.outputs.ready == 'true'
        run: pnpm test:frames || echo "::notice::M1 起强制"

      - name: 触感六件套 lint
        if: steps.check.outputs.ready == 'true'
        run: pnpm juice-lint || echo "::notice::M1 起强制"

  summary:
    name: gates
    runs-on: ubuntu-latest
    needs: [studio, discipline, docs, build]
    if: always()
    steps:
      - name: 汇总
        run: |
          echo "制度镜像: ${{ needs.studio.result }}"
          echo "纪律: ${{ needs.discipline.result }}"
          echo "文档: ${{ needs.docs.result }}"
          echo "构建: ${{ needs.build.result }}"
          if [ "${{ needs.studio.result }}" != "success" ] \
          || [ "${{ needs.discipline.result }}" != "success" ] \
          || [ "${{ needs.docs.result }}" != "success" ] \
          || [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::闸门未全绿。不许合并，也不许用 admin 强行合并。"
            exit 1
          fi
